<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>🎂 Happy Birthday Manammoo — Our Love Story</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a14">
  <meta name="description" content="A special birthday surprise for Manammoo — made with love by Ramees">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1"></script>
  <style>
    @keyframes fadeInScale {
      from { opacity: 0; transform: scale(0.92); }
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      25% { transform: scale(1.15); }
      50% { transform: scale(1); }
      75% { transform: scale(1.15); }
    }
    @keyframes loaderGlow {
      0%, 100% { box-shadow: 0 0 30px rgba(212,175,55,0.3); }
      50% { box-shadow: 0 0 60px rgba(255,107,157,0.5); }
    }
    .app-loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: linear-gradient(135deg, #0f0509, #2a1222, #1a0b14);
      z-index: 9999;
      animation: fadeInScale 0.4s ease-out;
    }
    .app-loading .heart-loader {
      font-size: clamp(2.5rem, 8vw, 3.5rem);
      animation: heartbeat 1s ease-in-out infinite;
      filter: drop-shadow(0 0 20px rgba(212,175,55,0.4));
    }
    .app-loading .loader-text {
      font-family: 'Georgia', serif;
      font-size: clamp(1rem, 3vw, 1.3rem);
      color: rgba(255,255,255,0.7);
      letter-spacing: 2px;
    }
    .app-loading .loader-name {
      font-family: 'Georgia', serif;
      font-size: clamp(1.4rem, 4vw, 2rem);
      background: linear-gradient(135deg, #f0c987, #ffe4a8, #ff8fab);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: loaderGlow 2s ease-in-out infinite;
      border-radius: 20px;
      padding: 4px 16px;
    }
  </style>
</head>
<body>
  <app-root>
    <div class="app-loading" id="app-loading">
      <div class="heart-loader">💝</div>
      <div class="loader-name">Manammoo</div>
      <div class="loader-text">Loading your surprise...</div>
    </div>
  </app-root>
</body>
</html>
